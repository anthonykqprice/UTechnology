name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design:
    name: Simulator, generator and validator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: pip install pyyaml==6.0.2
      - name: Simulator tests
        run: node design/sim/test.js
      - name: Generated files are up to date and the design is valid
        run: tools/check.sh

  pack:
    name: Pack export (packwiz)
    needs: addon
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.24', cache: false }
      - name: Install packwiz (pinned)
        run: go install github.com/packwiz/packwiz@v0.0.0-20260906154125-ef87d964f8cb
      - name: Index is up to date
        working-directory: pack
        run: |
          ~/go/bin/packwiz refresh
          test -z "$(git status --porcelain -- .)" || { git status --short -- .; echo "run packwiz refresh"; exit 1; }
      - uses: actions/download-artifact@v8
        with: { name: addon, path: addon-artifact }
      - name: Export with the addon jar
        run: tools/export-pack.sh "$(find addon-artifact -name 'utechnology-*.jar' | head -1)" UTechnology.mrpack
      - uses: actions/upload-artifact@v7
        with: { name: modpack, path: UTechnology.mrpack }

  addon:
    name: Addon build and GameTests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v6
      - name: Build, unit tests and GameTests
        working-directory: addon
        run: ./gradlew --no-daemon build runGameTestServer
      - uses: actions/upload-artifact@v7
        with: { name: addon, path: addon/build/libs/*.jar }
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: gametest-log, path: addon/run-gametest/logs/latest.log }
