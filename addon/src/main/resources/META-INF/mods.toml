modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    description = '''Machines and upgradeable multiblocks for the UTechnology GregTech pack.'''

[[dependencies.${mod_id}]]
    modId = "gtceu"
    mandatory = true
    versionRange = "[${gtceu_version},)"
    ordering = "AFTER"
    side = "BOTH"
[[dependencies.${mod_id}]]
    modId = "forge"
    mandatory = true
    versionRange = "[47,)"
    ordering = "NONE"
    side = "BOTH"
