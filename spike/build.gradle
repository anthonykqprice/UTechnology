// Spike 1: throwaway. Based on GregTechCEu/GregTech-Addon-Template (LGPLv3), trimmed.
plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = 'https://maven.gtceu.com' } }
        filter { includeGroup 'com.gregtechceu.gtceu' }
    }
    exclusiveContent { // LDLib, Configuration
        forRepository { maven { url = 'https://maven.firstdark.dev/snapshots/' } }
        filter { includeGroup 'com.lowdragmc.ldlib'; includeGroup 'dev.toma.configuration' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.tterrag.com/' } }
        filter { includeGroup 'com.tterrag.registrate' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.ftb.dev/releases' } }
        filter { includeGroup 'dev.ftb.mods' }
    }
    exclusiveContent {
        forRepository { maven { url = 'https://maven.architectury.dev/' } }
        filter { includeGroup 'dev.architectury' }
    }
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"
    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }
    runs {
        configureEach {
            systemProperty 'forge.logging.console.level', 'info'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            gameDirectory = project.file('run-server')
            programArguments.addAll('--nogui')
        }
        gameTestServer {
            type = 'gameTestServer'
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.1'
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'

    modImplementation("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    modImplementation("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")
    modImplementation("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")

    modImplementation("dev.ftb.mods:ftb-teams-forge:${ftbteams_version}") { transitive = false }
    modImplementation("dev.ftb.mods:ftb-library-forge:${ftblibrary_version}") { transitive = false }
    modImplementation("dev.architectury:architectury-forge:${architectury_version}") { transitive = false }
}

tasks.named('processResources', ProcessResources).configure {
    var props = [mod_id: mod_id, version: version, mod_name: mod_name, mod_license: mod_license,
                 gtceu_version: gtceu_version]
    inputs.properties(props)
    filesMatching('META-INF/mods.toml') { expand props }
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(17)
}

// let scripted tests drive the dedicated server console
tasks.matching { it.name == 'runServer' }.configureEach { standardInput = System.in }
