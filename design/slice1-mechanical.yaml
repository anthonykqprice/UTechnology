# Slice 1: mechanical components, LV to HV
# Source of truth for this slice. The factory simulator reads this file, and
# KubeJS scripts will later be generated from it.
#
# status on every recipe:
#   stock   = unchanged from GregTech CEu Modern 1.20.1 (checked against
#             ComponentRecipes.java, branch 1.20.1, commit 8cd78491)
#   changed = stock recipe we modify
#   new     = recipe added by this pack
#
# Units: duration in seconds, eut in EU/t. 1 s = 20 ticks.
# GT voltages (EU/t, one amp): LV 32, MV 128, HV 512. Recipe EU/t uses GT's
# "VA" values: LV 30, MV 120, HV 480.

meta:
  slice: mechanical-lv-hv
  version: 0.1-draft
  overclock: standard        # 4x EU/t for 2x speed per tier above the recipe
  rules:
    - Motors are the only component that recurses. Pistons, conveyors and robot
      arms keep their stock recipes and inherit the recursion through the motors
      they contain.
    - Bootstrap rule. A tier-N component must be makeable at tier N-1 voltage,
      with machines available at tier N-1. Otherwise the first tier-N machine
      could never be built.
    - Each tier introduces one new machine, and that machine is needed for the
      next tier's components.

# ---------------------------------------------------------------------------
# Items
# kind: supplied   = made by stock GT chains we are not modelling in this slice;
#                    raw = rough ingot-equivalent cost so the simulator can
#                    count materials (approximate, tune later)
# kind: part       = intermediate item added by this pack
# kind: component  = the components this slice is about
# ---------------------------------------------------------------------------
items:
  # supplied raw materials (ingots come from smelting chains not modelled in this slice)
  ingot_copper:            { kind: supplied, raw: { copper: 1 } }
  ingot_tin:               { kind: supplied, raw: { tin: 1 } }
  ingot_gold:              { kind: supplied, raw: { gold: 1 } }
  ingot_silver:            { kind: supplied, raw: { silver: 1 } }
  ingot_cupronickel:       { kind: supplied, raw: { cupronickel: 1 } }
  ingot_electrum:          { kind: supplied, raw: { electrum: 1 } }
  ingot_steel:             { kind: supplied, raw: { steel: 1 } }
  ingot_aluminium:         { kind: supplied, raw: { aluminium: 1 } }
  ingot_stainless_steel:   { kind: supplied, raw: { stainless_steel: 1 } }

  # stock GT intermediates now made in this slice (recipes below)
  wire_copper_single:      { kind: intermediate }
  wire_tin_single:         { kind: intermediate }
  wire_gold_single:        { kind: intermediate }
  wire_silver_double:      { kind: intermediate }
  wire_cupronickel_double: { kind: intermediate }
  wire_electrum_double:    { kind: intermediate }
  cable_tin_single:        { kind: intermediate }
  cable_copper_single:     { kind: intermediate }
  cable_gold_single:       { kind: intermediate }
  cable_silver_double:     { kind: intermediate }
  rod_steel:               { kind: intermediate }
  rod_aluminium:           { kind: intermediate }
  rod_stainless_steel:     { kind: intermediate }
  rod_magnetic_steel:      { kind: intermediate }

  # byproducts (GTM's default harderRods setting: lathe gives 1 rod + 2 small dusts)
  dust_small_steel:           { kind: byproduct }
  dust_small_aluminium:       { kind: byproduct }
  dust_small_stainless_steel: { kind: byproduct }

  # still supplied: stock GT intermediates whose machines aren't modelled yet
  plate_steel:             { kind: supplied, raw: { steel: 1 } }
  plate_aluminium:         { kind: supplied, raw: { aluminium: 1 } }
  plate_stainless_steel:   { kind: supplied, raw: { stainless_steel: 1 } }
  gear_small_steel:        { kind: supplied, raw: { steel: 1 } }
  gear_small_aluminium:    { kind: supplied, raw: { aluminium: 1 } }
  gear_small_stainless:    { kind: supplied, raw: { stainless_steel: 1 } }
  ring_stainless_steel:    { kind: supplied, raw: { stainless_steel: 0.25 } }
  circuit_lv:              { kind: supplied, note: circuit chain not modelled yet }
  circuit_mv:              { kind: supplied, note: circuit chain not modelled yet }
  circuit_hv:              { kind: supplied, note: circuit chain not modelled yet }
  frame_steel:             { kind: supplied, raw: { steel: 2 } }
  frame_aluminium:         { kind: supplied, raw: { aluminium: 2 } }
  frame_stainless_steel:   { kind: supplied, raw: { stainless_steel: 2 } }
  hull_lv:                 { kind: supplied, raw: { steel: 8, tin: 1, rubber: 2 } }
  hull_mv:                 { kind: supplied, raw: { aluminium: 8, copper: 1, rubber: 2 } }
  hull_hv:                 { kind: supplied, raw: { stainless_steel: 8, gold: 1, rubber: 2 } }
  assembler_lv:            { kind: supplied, note: stock GTM LV assembler, used in a multiblock controller recipe }
  wiremill_lv:             { kind: supplied, note: stock GTM LV wiremill, used in a multiblock controller recipe }
  lathe_lv:                { kind: supplied, note: stock GTM LV lathe, used in a multiblock controller recipe }

  # fluids (amounts in mB)
  rubber_fluid:            { kind: supplied, fluid: true }
  lubricant:               { kind: supplied, fluid: true, note: stock GT fluid }

  # new parts
  stator_coil_mv:          { kind: part, tier: MV, name: MV Stator Coil }
  stator_coil_hv:          { kind: part, tier: HV, name: HV Stator Coil }
  bearing_hv:              { kind: part, tier: HV, name: Precision Bearing }

  # components
  motor_lv:                { kind: component, tier: LV, family: wound }
  motor_mv:                { kind: component, tier: MV, family: wound }
  motor_hv:                { kind: component, tier: HV, family: wound }
  piston_lv:               { kind: component, tier: LV }
  piston_mv:               { kind: component, tier: MV }
  piston_hv:               { kind: component, tier: HV }
  conveyor_lv:             { kind: component, tier: LV }
  conveyor_mv:             { kind: component, tier: MV }
  conveyor_hv:             { kind: component, tier: HV }
  robot_arm_lv:            { kind: component, tier: LV }
  robot_arm_mv:            { kind: component, tier: MV }
  robot_arm_hv:            { kind: component, tier: HV }

# ---------------------------------------------------------------------------
# Machines
# ---------------------------------------------------------------------------
machines:
  assembler:
    status: stock
    kind: single
    tiers: [LV, MV, HV]
    runs: [assembler]

  wiremill:
    status: stock
    kind: single
    tiers: [LV, MV, HV]
    runs: [wiremill]

  lathe:
    status: stock
    kind: single
    tiers: [LV, MV, HV]
    runs: [lathe]

  polarizer:
    status: stock
    kind: single
    tiers: [LV, MV, HV]
    runs: [polarizer]

  coil_winder:
    status: new
    kind: single
    tiers: [LV, MV, HV]
    unlocked_at: LV
    runs: [coil_winder]
    purpose: Winds stator coils. Needed for MV motors (LV voltage) and HV motors (MV voltage).

  bearing_press:
    status: new
    kind: single
    tiers: [MV, HV]
    unlocked_at: MV
    runs: [bearing_press]
    purpose: Presses precision bearings with lubricant. Needed for HV motors.

  component_assembler:
    status: new
    kind: multiblock
    spec: multiblocks.yaml        # frames, segments, modules, structure and builds live there
    runs: [assembler]
    filter: component             # only recipes tagged component: true

  assembly_hall:
    status: new
    kind: multiblock
    spec: multiblocks.yaml
    runs: [assembler]
    filter: not_component         # assembler recipes not tagged component

  wire_drawing_line:
    status: new
    kind: multiblock
    spec: multiblocks.yaml
    runs: [wiremill]

  turning_line:
    status: new
    kind: multiblock
    spec: multiblocks.yaml
    runs: [lathe]

# ---------------------------------------------------------------------------
# Recipes
# ---------------------------------------------------------------------------
recipes:

  # ---- motors (the recursive chain) ----
  - id: motor_lv
    status: stock
    machine: assembler
    component: true
    eut: 30
    duration: 5
    in:  { cable_tin_single: 2, rod_steel: 2, rod_magnetic_steel: 1, wire_copper_single: 4 }
    out: { motor_lv: 1 }

  - id: stator_coil_mv
    status: new
    machine: coil_winder
    eut: 30                      # LV voltage, per the bootstrap rule
    duration: 10
    in:  { rod_magnetic_steel: 1, wire_cupronickel_double: 4 }
    out: { stator_coil_mv: 1 }
    note: Takes over the wire and magnet that stock puts directly into the MV motor.

  - id: motor_mv
    status: changed
    machine: assembler
    component: true
    eut: 30
    duration: 10
    in:  { motor_lv: 2, stator_coil_mv: 1, rod_aluminium: 2, cable_copper_single: 2 }
    out: { motor_mv: 1 }
    stock_was: { in: { cable_copper_single: 2, rod_aluminium: 2, rod_magnetic_steel: 1, wire_cupronickel_double: 4 }, duration: 5 }

  - id: stator_coil_hv
    status: new
    machine: coil_winder
    eut: 120                     # MV voltage
    duration: 10
    in:  { rod_magnetic_steel: 1, wire_electrum_double: 4 }
    out: { stator_coil_hv: 1 }

  - id: bearing_hv
    status: new
    machine: bearing_press
    eut: 120                     # MV voltage
    duration: 8
    in:  { ring_stainless_steel: 2, rod_stainless_steel: 1 }
    fluid_in: { lubricant: 50 }
    out: { bearing_hv: 2 }

  - id: motor_hv
    status: changed
    machine: assembler
    component: true
    eut: 120
    duration: 10
    in:  { motor_mv: 3, stator_coil_hv: 1, bearing_hv: 2, rod_stainless_steel: 2, cable_silver_double: 2 }
    out: { motor_hv: 1 }
    stock_was: { in: { cable_silver_double: 2, rod_stainless_steel: 2, rod_magnetic_steel: 1, wire_electrum_double: 4 }, eut: 30, duration: 5 }

  # ---- pistons (stock) ----
  - id: piston_lv
    status: stock
    machine: assembler
    component: true
    eut: 30
    duration: 5
    in:  { rod_steel: 2, cable_tin_single: 2, plate_steel: 3, gear_small_steel: 1, motor_lv: 1 }
    out: { piston_lv: 1 }

  - id: piston_mv
    status: stock
    machine: assembler
    component: true
    eut: 30
    duration: 5
    in:  { rod_aluminium: 2, cable_copper_single: 2, plate_aluminium: 3, gear_small_aluminium: 1, motor_mv: 1 }
    out: { piston_mv: 1 }

  - id: piston_hv
    status: stock
    machine: assembler
    component: true
    eut: 30
    duration: 5
    in:  { rod_stainless_steel: 2, cable_gold_single: 2, plate_stainless_steel: 3, gear_small_stainless: 1, motor_hv: 1 }
    out: { piston_hv: 1 }

  # ---- conveyors (stock; rubber variant; GTM also has silicone and styrene-butadiene rubber versions) ----
  - id: conveyor_lv
    status: stock
    machine: assembler
    component: true
    eut: 30
    duration: 5
    circuit: 1                 # stock GTM 7.5.3 (found by the stock-recipe GameTest)
    in:  { cable_tin_single: 1, motor_lv: 2 }
    fluid_in: { rubber_fluid: 864 }
    out: { conveyor_lv: 1 }

  - id: conveyor_mv
    status: stock
    machine: assembler
    component: true
    eut: 30
    duration: 5
    circuit: 1                 # stock GTM 7.5.3 (found by the stock-recipe GameTest)
    in:  { cable_copper_single: 1, motor_mv: 2 }
    fluid_in: { rubber_fluid: 864 }
    out: { conveyor_mv: 1 }

  - id: conveyor_hv
    status: stock
    machine: assembler
    component: true
    eut: 30
    duration: 5
    circuit: 1                 # stock GTM 7.5.3 (found by the stock-recipe GameTest)
    in:  { cable_gold_single: 1, motor_hv: 2 }
    fluid_in: { rubber_fluid: 864 }
    out: { conveyor_hv: 1 }

  # ---- robot arms (stock) ----
  - id: robot_arm_lv
    status: stock
    machine: assembler
    component: true
    eut: 30
    duration: 5
    in:  { cable_tin_single: 3, rod_steel: 2, motor_lv: 2, piston_lv: 1, circuit_lv: 1 }
    out: { robot_arm_lv: 1 }

  - id: robot_arm_mv
    status: stock
    machine: assembler
    component: true
    eut: 30
    duration: 5
    in:  { cable_copper_single: 3, rod_aluminium: 2, motor_mv: 2, piston_mv: 1, circuit_mv: 1 }
    out: { robot_arm_mv: 1 }

  - id: robot_arm_hv
    status: stock
    machine: assembler
    component: true
    eut: 30
    duration: 5
    in:  { cable_gold_single: 3, rod_stainless_steel: 2, motor_hv: 2, piston_hv: 1, circuit_hv: 1 }
    out: { robot_arm_hv: 1 }

  # ---- stock intermediates (GTM 7.5.3 generators: WireRecipeHandler,
  # PartsRecipeHandler.processRod, PolarizingRecipeHandler). Durations are GT's
  # formulas from material mass, converted from ticks to seconds.
  # "circuit" is a programmed circuit: not consumed, it picks between recipes
  # that share an input (single vs double wire from the same ingot).

  # wiremill: 7 EU/t (ULV) for every metal here (blast temperature < 2800 K)
  - { id: wire_copper_single,      status: stock, machine: wiremill, eut: 7, duration: 3.15, circuit: 1, in: { ingot_copper: 1 },      out: { wire_copper_single: 2 } }
  - { id: wire_tin_single,         status: stock, machine: wiremill, eut: 7, duration: 5.9,  circuit: 1, in: { ingot_tin: 1 },         out: { wire_tin_single: 2 } }
  - { id: wire_gold_single,        status: stock, machine: wiremill, eut: 7, duration: 9.8,  circuit: 1, in: { ingot_gold: 1 },        out: { wire_gold_single: 2 } }
  - { id: wire_silver_double,      status: stock, machine: wiremill, eut: 7, duration: 5.35, circuit: 2, in: { ingot_silver: 1 },      out: { wire_silver_double: 1 } }
  - { id: wire_cupronickel_double, status: stock, machine: wiremill, eut: 7, duration: 3.0,  circuit: 2, in: { ingot_cupronickel: 1 }, out: { wire_cupronickel_double: 1 } }
  - { id: wire_electrum_double,    status: stock, machine: wiremill, eut: 7, duration: 7.55, circuit: 2, in: { ingot_electrum: 1 },    out: { wire_electrum_double: 1 } }

  # cable covering in the assembler: 1 wire + 1 ingot's worth (144 mB) of rubber, 5 s at 7 EU/t
  - { id: cable_tin_single,    status: stock, machine: assembler, eut: 7, duration: 5, in: { wire_tin_single: 1 },    fluid_in: { rubber_fluid: 144 }, out: { cable_tin_single: 1 } }
  - { id: cable_copper_single, status: stock, machine: assembler, eut: 7, duration: 5, in: { wire_copper_single: 1 }, fluid_in: { rubber_fluid: 144 }, out: { cable_copper_single: 1 } }
  - { id: cable_gold_single,   status: stock, machine: assembler, eut: 7, duration: 5, in: { wire_gold_single: 1 },   fluid_in: { rubber_fluid: 144 }, out: { cable_gold_single: 1 } }
  - { id: cable_silver_double, status: stock, machine: assembler, eut: 7, duration: 5, in: { wire_silver_double: 1 }, fluid_in: { rubber_fluid: 144 }, out: { cable_silver_double: 1 } }

  # lathe: 16 EU/t, duration = 2 x mass ticks; harderRods gives 1 rod + 2 small dusts
  - { id: rod_steel,           status: stock, machine: lathe, eut: 16, duration: 5.6, in: { ingot_steel: 1 },           out: { rod_steel: 1, dust_small_steel: 2 } }
  - { id: rod_aluminium,       status: stock, machine: lathe, eut: 16, duration: 2.6, in: { ingot_aluminium: 1 },       out: { rod_aluminium: 1, dust_small_aluminium: 2 } }
  - { id: rod_stainless_steel, status: stock, machine: lathe, eut: 16, duration: 5.5, in: { ingot_stainless_steel: 1 }, out: { rod_stainless_steel: 1, dust_small_stainless_steel: 2 } }

  # polarizer: steel rod to magnetic steel rod, 16 EU/t
  - { id: rod_magnetic_steel, status: stock, machine: polarizer, eut: 16, duration: 1.4, in: { rod_steel: 1 }, out: { rod_magnetic_steel: 1 } }

# ---------------------------------------------------------------------------
# Machine build recipes (what it costs to build the factory)
# All new; numbers are first guesses.
# ---------------------------------------------------------------------------
builds:
  - id: coil_winder_lv
    builds: coil_winder
    tier: LV
    in: { hull_lv: 1, motor_lv: 2, wire_copper_single: 4, circuit_lv: 2 }

  - id: coil_winder_mv
    builds: coil_winder
    tier: MV
    in: { hull_mv: 1, motor_mv: 2, wire_cupronickel_double: 4, circuit_mv: 2 }

  - id: coil_winder_hv
    builds: coil_winder
    tier: HV
    in: { hull_hv: 1, motor_hv: 2, wire_electrum_double: 4, circuit_hv: 2 }

  - id: bearing_press_mv
    builds: bearing_press
    tier: MV
    in: { hull_mv: 1, piston_mv: 2, motor_mv: 1, circuit_mv: 2 }

  - id: bearing_press_hv
    builds: bearing_press
    tier: HV
    in: { hull_hv: 1, piston_hv: 2, motor_hv: 1, circuit_hv: 2 }

  # Multiblock controllers, cores, casings, retrofit kits and modules are in
  # multiblocks.yaml. How every build is made: see build_rule in multiblocks.yaml.

# ---------------------------------------------------------------------------
# Decisions
# ---------------------------------------------------------------------------
decisions:
  - id: component-voltage
    decided: 2026-10-12
    decision: Component recipes stay one voltage tier below their own tier.
    why: >-
      Power. Raising a recipe one voltage tier at the same duration costs 4x the
      energy per craft, and recursion multiplies that through every component.
      Early on the blast furnace is already the biggest power sink, so
      components should not add a second one.
    alternative_kept_in_reserve: >-
      GT multiblocks with two or more energy hatches at their highest tier run
      one tier higher (WorkableElectricMultiblockMachine.getMaxVoltage), so the
      component assembler could reach a component's own voltage without a
      bootstrap recipe. Use this as a targeted gate if the simulator shows no
      reason to upgrade the frame.
  - id: prototype-start
    decided: 2026-10-12
    decision: >-
      The playable prototype starts at LV in a test world with ingots, rubber and
      the slice's other supplied materials handed out. No ore processing,
      skyblock, steam age or quests.
    why: >-
      Tests the core loop (recursion, growing multiblocks, research) without
      building the full early game first.
  - id: ae2-logistics
    decided: 2026-10-13
    decision: >-
      AE2 is the logistics tool for the whole pack and is in the prototype from LV.
      Recipe conflicts are allowed, as in stock GregTech, but each must be solvable
      with programmed circuits or distinct input buses, never by blocking mode with
      multiplied patterns. Conflicts in our own recipes are deliberate and listed by
      the validator.
    why: >-
      Handling conflicts is part of GregTech gameplay, and keeping stock recipes as
      they are avoids auditing and changing them. Requiring standard solutions keeps
      non-blocking pattern providers working, so parallels raised by research fill
      without re-encoding patterns.
    revised: 2026-10-13 (first version banned conflicts)
    gtm_note: >-
      In GTM 7.5.3 a distinct input bus sees only its own slots, never a fluid hatch.
      Recipes with fluids are kept apart with GTM's colour groups instead: dye an input
      bus and a fluid hatch the same colour and they form their own group. A machine's
      two fluid hatches allow two such groups. tools/validate.py checks every multiblock
      against this (docs/validation-report.md lists the groups).
  - id: per-machine-upgrades
    decided: 2026-10-13
    decision: >-
      Machines are upgraded individually: frames (through retrofit kits), segments
      and modules. Upgrades are optional. There is no global research tree.
    why: >-
      Upgrading each machine is a soft limit on how many machines are practical,
      and turns "build another or upgrade this one" into a real choice. Unupgraded
      machines stay useful for passive and low-volume work. Upgrades living on the
      machine needs no team or save-data systems, which is simpler and more stable.
      Retrofit kits keep the upgrade a single action per machine.
    supersedes: [team-research, machines-follow-player, research-ownership, research-v1.yaml]
  - id: disable-overlapping-large-multiblocks
    decided: 2026-10-13
    decision: >-
      Disable GTM's large_wiremill, large_assembler and large_cutter (remove their
      recipes and hide them). Decide the other stock Large multiblocks when we
      design those machine types.
    why: >-
      They duplicate our upgradeable multiblocks and would make them obsolete
      later. large_cutter also switches between two recipe types, which the pack's
      rules don't allow.
  - id: hard-mode-scope
    decided: 2026-10-13
    decision: >-
      GTM's hard recipe options are on (circuits, controllers, redstone, tools and
      armor, bricks, misc, plus the defaults). Wood nerfs, hard dye recipes and
      removeVanillaBlockRecipes stay off.
    why: On a skyblock start those mostly add tedium without a new mechanic.
  - id: higher-tier-machine-builds
    decided: 2026-10-13
    decision: >-
      MV and HV coil winders and the HV bearing press follow the LV and MV builds:
      that tier's hull, motors or pistons and circuits, and for coil winders the wire
      they wind at that tier (cupronickel at MV, electrum at HV).
    why: >-
      The prototype plan needs these tiers and the design only gave the first build
      of each machine. Numbers are first guesses like the others.
  - id: team-research
    status: superseded by per-machine-upgrades
    decided: 2026-10-13
    decision: >-
      Research belongs to teams (FTB Teams), not players. A solo player is a team
      of one. Machines get their team through their owner.
    why: >-
      Future-proofs multiplayer. Switching from per-player to team research later
      would change the save format.
  - id: machines-follow-player
    status: superseded by per-machine-upgrades (kept in case team features return)
    decided: 2026-10-13
    decision: >-
      A machine belongs to the player who placed it and uses that player's current
      effective team (FTB TeamManager.getTeamForPlayerID). If the player changes
      teams, their machines change with them.
    why: >-
      Matches GTM's own ownership model and needs no extra state. Stamping a team
      onto machines goes stale when parties disband. A claim or transfer tool can be
      added later if needed.
  - id: research-ownership
    status: superseded by per-machine-upgrades
    decided: 2026-10-13
    decision: >-
      Research belongs to the team that completed it. A player's solo research stays
      on their personal team: it doesn't apply while they are in a party and returns
      if they leave. A one-way "contribute to party" action may be added later.
    why: >-
      Predictable and exploit-free (no borrowing research by joining and leaving
      parties), and nothing is ever lost.

# ---------------------------------------------------------------------------
# Open questions for this slice
# ---------------------------------------------------------------------------
open_questions:
  - >-
    Recursion counts. MV motor takes 2 LV motors and HV takes 3 MV, so an HV
    robot arm contains 18 LV motors. Too steep, about right, or too gentle?
  - >-
    Do the HV piston and robot arm also need precision bearings, or only motors?
  - >-
    What does the HV tier's new machine make for EV components? This is where
    the magnetic family could start, since stock GT already switches to
    neodymium magnets at EV.
