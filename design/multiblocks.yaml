# Multiblocks: shared framework and the prototype's four multiblocks
# Source of truth for frames, segments, modules, structures and hatch rules.
# Recipes the machines run live in the slice files; this file defines the machines.
# Checked against GTM 7.5.3 source (block names, bus sizes, voltage rules).

meta:
  version: 0.1-draft

# ---------------------------------------------------------------------------
# Framework shared by every upgradeable multiblock
# ---------------------------------------------------------------------------
framework:
  implementation: >-
    One Java base class (WorkableElectricMultiblockMachine underneath) holding all
    pattern, segment-count, frame and module logic, per CLAUDE.md, so the GTM 8.0
    pattern migration touches one place.

  structure:
    shape: 3 wide, 3 tall. Length is 1 front aisle + N segments + 1 end aisle.
    legend:
      X: controller
      H: frame casing, or a hatch
      C: frame casing only
      K: the machine's core block (specific to each machine type)
      F: frame box of the frame material (e.g. gtceu:steel_frame)
    aisles:            # rows listed top to bottom, seen from the front
      front:   ["HHH", "HXH", "HHH"]
      segment: ["CCC", "CKC", "CCC"]     # repeats 1 to frame's max_segments_built
      end:     ["FHF", "HHH", "FHF"]
    spike_rule: >-
      GTM double-counts limited hatches in the aisle right after a repeatable aisle
      unless that aisle's first checked block differs from the segment's. The end
      aisle's corners are frame boxes, not casings, so its first checked block always
      differs. Required GameTest: limited hatches in the end aisle form correctly at
      every length from 1 to the largest cap.
    max_segments_built: 32   # pattern upper bound; extra segments beyond the cap count for nothing

  hatches:
    positions: Any H. Front and end aisles together offer 15 positions.
    limits:
      maintenance: { min: 1, max: 1, note: required while GTM maintenance is enabled }
      energy_input: { min: 1, max: 2 }
      item_input_bus: { min: 1, max: 6 }
      item_output_bus: { min: 1, max: 2 }
      fluid_input_hatch: { min: 0, max: 2, only_if: machine uses fluids }
      fluid_output_hatch: { min: 0, max: 1, only_if: machine outputs fluids }
    voltage: >-
      The machine's max voltage is capped at its frame's max_voltage, whatever its
      energy hatches are. This also overrides GTM's "two hatches give one tier more"
      rule, which stays in reserve as a deliberate gate (see the component-voltage
      decision in slice1-mechanical.yaml).
    bus_sizes: >-
      GTM item buses hold (1 + tier)^2 slots: LV 4, MV 9, HV 16. Buses in normal mode
      pool their slots; a distinct bus must hold a whole recipe by itself. The
      validator checks every recipe against the buses available at its tier.

  frames:
    steel:           { tier: LV, casing: gtceu:solid_machine_casing,     frame_box: gtceu:steel_frame,           max_voltage: LV, segment_cap: 4,  module_slots: 1 }
    aluminium:       { tier: MV, casing: gtceu:frostproof_machine_casing, frame_box: gtceu:aluminium_frame,       max_voltage: MV, segment_cap: 8,  module_slots: 2 }
    stainless_steel: { tier: HV, casing: gtceu:clean_machine_casing,     frame_box: gtceu:stainless_steel_frame, max_voltage: HV, segment_cap: 16, module_slots: 3 }
  frame_notes:
    - Frames reuse GTM's stock casings and frame boxes, so textures and recipes already exist.
    - Every casing and frame box in a structure must be the same material.
    - >-
      Segment caps doubled from the slice's first draft (2/4/8 to 4/8/16) for more
      physical growth. The spike measured 37.5 µs per structure check at 8 segments;
      16 must be measured before it ships.

  segments:
    parallels: one per counted segment
    counted: min(segments built, frame segment_cap)
    over_cap: >-
      A structure longer than its cap still forms, runs at the cap, and shows "build
      a better frame to use all segments". Players can build ahead.
    cost: 8 casings + 1 core block of the machine type.

  retrofit:
    action: >-
      Right-click the controller with retrofit kits of the next frame. The machine
      converts all its casings and frame boxes in one action and gives the old ones
      back to the player. Controller, hatches, cores and modules stay.
    kits_needed: one per 8 casings or frame boxes, rounded up
    downgrade: Allowed the same way, with kits of the lower frame.

  modules:
    install: >-
      Item slots in the controller's screen; the frame sets how many. Removing a
      module returns it. Effects apply from the next recipe
      (alwaysTryModifyRecipe).
    shared: [specialization_lock, efficiency_coil, batch_bus]   # defined below
    unique_per_machine: none in v1
    unique_note: >-
      Machine-specific modules would only be renamed speed or energy boosts unless
      they change recipe outputs, which would break material balance. Each machine
      differs through its core block, recipe type and role in the chain instead.
      Revisit when a machine needs a real mechanic of its own.
  module_definitions:
    specialization_lock:
      unlocked_at: LV
      effect: Locks to the next recipe the machine runs; only that recipe, at 2x speed.
      duration: 0.5
    efficiency_coil:
      unlocked_at: MV
      effect: 25% less energy per craft; recipes take 25% longer.
      energy: 0.75
      duration: 1.25
    batch_bus:
      unlocked_at: HV
      effect: Doubles parallels. Each recipe run consumes lubricant.
      parallels: 2.0
      upkeep: { lubricant: 10 }
      naming_note: GTM has an unrelated "batch mode"; rename before release to avoid confusion.
  modifier_order: segments (parallels), then modules, then overclocking

# ---------------------------------------------------------------------------
# The prototype's multiblocks
# ---------------------------------------------------------------------------
machines:
  component_assembler:
    name: Component Assembler
    runs: assembler recipes marked component (motors, pistons, conveyors, robot arms)
    fluids: in             # conveyor recipes use liquid rubber
    core:
      id: assembly_arm_housing
      name: Assembly Arm Housing
      in: { robot_arm_lv: 2, conveyor_lv: 2, frame_steel: 1 }
      note: >-
        About 10 LV motors per segment. Growing the machine pulls on the same
        component chain it produces, which is the point.
    controller:
      in: { assembler_lv: 1, robot_arm_lv: 2, conveyor_lv: 2, circuit_lv: 3 }

  assembly_hall:
    name: Assembly Hall
    runs: all other assembler recipes (cables, hulls, casings, machines)
    fluids: in             # cables use liquid rubber
    core:
      id: assembly_bench_unit
      name: Assembly Bench Unit
      in: { robot_arm_lv: 1, piston_lv: 2, frame_steel: 1 }
    controller:
      in: { assembler_lv: 1, robot_arm_lv: 2, piston_lv: 2, circuit_lv: 3 }

  wire_drawing_line:
    name: Wire Drawing Line
    runs: wiremill recipes
    fluids: none
    core:
      id: drawing_die_unit
      name: Drawing Die Unit
      in: { motor_lv: 2, gear_small_steel: 2, frame_steel: 1 }
    controller:
      in: { wiremill_lv: 1, motor_lv: 2, conveyor_lv: 1, circuit_lv: 3 }

  turning_line:
    name: Turning Line
    runs: lathe recipes
    fluids: none
    core:
      id: spindle_unit
      name: Spindle Unit
      in: { motor_lv: 2, piston_lv: 1, frame_steel: 1 }
    controller:
      in: { lathe_lv: 1, motor_lv: 2, piston_lv: 1, circuit_lv: 3 }

# ---------------------------------------------------------------------------
# Build recipes for the framework (casings, retrofit kits, modules)
# Controllers and cores are listed with each machine above.
# ---------------------------------------------------------------------------
builds:
  - id: casing_steel
    builds: casing
    status: stock (check exact recipe against GTM 7.5.3)
    frame: steel
    in: { plate_steel: 6, frame_steel: 1 }
    out: 2

  - id: casing_aluminium
    builds: casing
    status: stock (check exact recipe against GTM 7.5.3)
    frame: aluminium
    in: { plate_aluminium: 6, frame_aluminium: 1 }
    out: 2

  - id: casing_stainless_steel
    builds: casing
    status: stock (check exact recipe against GTM 7.5.3)
    frame: stainless_steel
    in: { plate_stainless_steel: 6, frame_stainless_steel: 1 }
    out: 2

  - id: retrofit_kit_aluminium
    builds: retrofit_kit
    frame: aluminium
    note: Converts 8 casings to aluminium. Costs the same as 8 new casings.
    in: { plate_aluminium: 24, frame_aluminium: 4 }

  - id: retrofit_kit_stainless_steel
    builds: retrofit_kit
    frame: stainless_steel
    note: Converts 8 casings to stainless steel. Costs the same as 8 new casings.
    in: { plate_stainless_steel: 24, frame_stainless_steel: 4 }

  - id: module_specialization_lock
    builds: specialization_lock
    tier: LV
    in: { robot_arm_lv: 1, circuit_lv: 2, plate_steel: 4 }

  - id: module_efficiency_coil
    builds: efficiency_coil
    tier: MV
    in: { stator_coil_mv: 4, circuit_mv: 2, plate_aluminium: 4 }

  - id: module_batch_bus
    builds: batch_bus
    tier: HV
    in: { conveyor_hv: 2, robot_arm_hv: 1, circuit_hv: 2, plate_stainless_steel: 4 }

# ---------------------------------------------------------------------------
# Overlap with GTM's stock "Large" multiblocks
# ---------------------------------------------------------------------------
stock_overlap:
  found_in_gtm: >-
    GTM ships GCYM-style multiblocks including large_wiremill ("Large Wire
    Factory"), large_assembler, and large_cutter, which runs both cutter and lathe
    recipes.
  recommendation: >-
    Disable large_wiremill and large_assembler (remove their recipes and hide them),
    since they would duplicate ours and make them obsolete later. large_cutter also
    switches between two recipe types, which our rules don't allow; disable it too,
    or keep it cutter-only if that's possible without code. Decide the rest of the
    Large multiblocks when we design those machine types.

open_questions:
  - Machine names are placeholders; rename freely before IDs are fixed.
  - >-
    Core block costs make segments expensive in components (about 10 LV motors per
    Component Assembler segment). The simulator should check how long a 16-segment
    build takes to pay off.
  - Disable the overlapping stock Large multiblocks, as recommended?
